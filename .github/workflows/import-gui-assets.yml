name: Validate versioned GUI prototype assets
on:
  push:
    paths:
      - 'assets/gui/production/**'
      - 'assets/gui/rendered-v1/**'
      - 'tools/*gui*'
      - 'tests/test_import_assets.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/import_gui_assets.py --verify
      - run: python tools/audit_gui_assets.py
      - run: python -m unittest discover -s tests -v
