name: Native Windows x64
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4314.35 -OutputDirectory native/deps -NonInteractive -DirectDownload
          if ($LASTEXITCODE -ne 0) { throw 'NuGet WebView2 SDK installation failed' }
          if (!(Test-Path native/deps/Microsoft.Web.WebView2.1.0.4314.35/build/native/include/WebView2.h)) { throw 'WebView2.h missing' }
      - name: Configure
        run: cmake -S native -B native/build -A x64
      - name: Build
        run: cmake --build native/build --config Release
      - name: Unit tests
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: Download and verify ngspice 47 for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://community.chocolatey.org/api/v2/package/ngspice/47.0.0'
          curl.exe -L --fail --retry 3 --retry-delay 5 -o ngspice.nupkg $url
          if ($LASTEXITCODE -ne 0) { throw 'Download signed Chocolatey distribution failed' }
          7z x ngspice.nupkg -ongspice-package -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey package extraction failed' }
          $archive = Get-ChildItem ngspice-package -Recurse -Filter ngspice-47_64.7z | Select-Object -First 1
          if (!$archive) { throw 'Official ngspice archive missing in Chocolatey package' }
          Copy-Item $archive.FullName ngspice-47_64.7z
          $actual = (Get-FileHash ngspice-47_64.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '59225971bd68cdd1199443649aa4615a9e6d684933f205ab49006a3942518f5a'
          if ($actual -ne $expected) { throw "ngspice SHA256 mismatch: $actual" }
          7z x ngspice-47_64.7z -onative/build/Release/ngspice -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z extraction failed' }
          $solver = Get-ChildItem native/build/Release/ngspice -Recurse -Filter ngspice_con.exe | Select-Object -First 1
          if (!$solver) { throw 'ngspice_con.exe not found in release archive' }
          Write-Host "Found solver: $($solver.FullName)"
          $solver.DirectoryName | Out-File -FilePath solver-path.txt
      - name: Windows end-to-end SPICE test
        shell: pwsh
        run: |
          $solverDir = Get-Content solver-path.txt -Raw
          $solverDir = $solverDir.Trim()
          $env:PATH = "$solverDir;$env:PATH"
          $env:SPICE_LIB_DIR = Join-Path (Split-Path $solverDir -Parent) 'share/ngspice'
          $env:SPICE_EXEC_DIR = $solverDir
          if (!(Test-Path (Join-Path $env:SPICE_LIB_DIR 'scripts/spinit'))) { throw 'Bundled ngspice spinit is missing' }
          python native/tests/spice_integration.py native/build/Release/vbal_render_spice.exe
          python native/tests/diode_integration.py native/build/Release/vbal_render_spice.exe
          python native/tests/graph_integration.py native/build/Release/vbal_render_graph.exe
      - name: Embedded WebView2 startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "native/build/Release/vbal_breadboard.exe"
          New-Item -ItemType Directory -Force -Path native/build/Release/web | Out-Null
          Copy-Item web/editor.html native/build/Release/web/editor.html
          $started = Get-Date
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw "WebView2 app exited with code $($app.ExitCode)" }
          $renderers = @(Get-CimInstance Win32_Process -Filter "name = 'msedgewebview2.exe'" | Where-Object {
            $_.CommandLine -like '*JerzyVirtualBreadboard*' -or $_.ParentProcessId -eq $app.Id
          })
          if ($renderers.Count -eq 0) { throw 'No WebView2 renderer process found: browser embedding may have failed' }
          Stop-Process -Id $app.Id -Force
          Write-Host "PASS: standalone WebView2 editor created $($renderers.Count) renderer processes"
      - name: GUI startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "native/build/Release/vbal_gui.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          $process.Refresh()
          if ($process.HasExited) {
            throw "GUI exited unexpectedly with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "PASS: GUI remains open without command line arguments"
      - name: Breadboard wire regression
        run: node web/test_wiring.js
      - name: Bundle interactive breadboard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/build/Release/web | Out-Null
          Copy-Item web/editor.html native/build/Release/web/editor.html
          if (!(Test-Path native/build/Release/web/editor.html)) { throw 'Breadboard editor missing' }
      - name: Upload Windows apps
        uses: actions/upload-artifact@v4
        with:
          name: VBAL-Windows-SPICE-GUI-x64
          path: |
            native/build/Release/vbal_gui.exe
            native/build/Release/vbal_breadboard.exe
            native/build/Release/WebView2Loader.dll
            native/build/Release/web/**
            native/build/Release/ngspice/**
            native/build/Release/vbal_rc.exe
            native/build/Release/vbal_spice.exe
            native/build/Release/vbal_render_spice.exe
