name: Windows x64 M0 build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        raster: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pinned prototype artwork and importer
        run: |
          python tools/import_gui_assets.py --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/audit_gui_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure MSVC x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DMF_GUI_ASSETS=${{ matrix.raster }} -DBUILD_TESTING=ON 2>&1 | Tee-Object -FilePath configure.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $diagnostic = (Get-Content configure.log -Tail 100) -join "`n"
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Configure MSVC x64 diagnostic::$diagnostic"
          }
          exit $result
      - name: Build VST3 and smoke tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $diagnostic = (Get-Content build.log -Tail 100) -join "`n"
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Build VST3 and smoke tests diagnostic::$diagnostic"
          }
          exit $result
      - name: CTest (Release assertions remain active)
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error 2>&1 | Tee-Object -FilePath ctest.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $diagnostic = (Get-Content ctest.log -Tail 100) -join "`n"
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CTest (Release assertions remain active) diagnostic::$diagnostic"
          }
          exit $result
      - name: Upload experimental M0 binary (not a production release)
        if: matrix.raster == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: JerzyMicrophonicFuzz-Windows-x64-experimental
          path: build/MicrophonicFuzz_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
      - name: Upload visual GUI smoke evidence
        if: matrix.raster == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: JerzyMicrophonicFuzz-GUI-screenshots-experimental
          path: build/screenshots/*.png
          if-no-files-found: error
