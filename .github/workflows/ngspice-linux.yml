name: Linux ngspice integration
on: [push, pull_request]
jobs:
  ngspice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --config Release -j 2
      - name: Unit tests
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: ngspice WAV render
        run: python3 native/tests/spice_integration.py native/build/vbal_render_spice
      - name: XSPICE long WAV source
        run: python3 native/tests/filesource_integration.py
      - name: Real diode clipping simulation
        run: python3 native/tests/diode_integration.py native/build/vbal_render_spice
      - name: Editor graph through actual ngspice
        run: python3 native/tests/graph_integration.py native/build/vbal_render_graph
      - name: Circuit-derived effect WAV tests (EQ, Ge/Si diodes, Ge Fuzz Face)
        run: python3 native/tests/real_effects_integration.py native/build/vbal_render_graph
      - name: Hybrid audio from wired PT2399 and MN3007/3101
        run: python3 native/tests/hybrid_wav_integration.py native/build/vbal_render_graph
      - name: HTML breadboard syntax
        run: python3 web/test_editor.py && node web/test_wiring.js
